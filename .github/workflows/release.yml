name: Release

on:
  push:
    tags:
      - "v*"
  # Manual publish: Actions -> Release -> "Run workflow".
  # Creates the tag on the chosen ref if it does not exist yet, then publishes.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.1.4)"
        required: true
        type: string
      dry_run:
        description: "Build only (snapshot); upload artifacts instead of publishing a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            case "${TAG}" in v*) ;; *) echo "tag must start with 'v' (got '${TAG}')"; exit 1 ;; esac
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "${TAG}" -m "Release ${TAG}"
              if [ "${{ inputs.dry_run }}" != "true" ]; then
                git push origin "refs/tags/${TAG}"
              fi
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Releasing ${TAG}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Resolve GoReleaser flags
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          ARGS="release --clean --skip=validate"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="${ARGS} --snapshot --skip=sign,publish"
            echo "SIGN=false" >> "$GITHUB_ENV"
          elif [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret not set; publishing unsigned artifacts (not accepted by the Terraform Registry)"
            ARGS="${ARGS} --skip=sign"
            echo "SIGN=false" >> "$GITHUB_ENV"
          else
            echo "SIGN=true" >> "$GITHUB_ENV"
          fi
          echo "GORELEASER_ARGS=${ARGS}" >> "$GITHUB_ENV"
          echo "goreleaser ${ARGS}"

      - name: Import GPG key
        if: ${{ env.SIGN == 'true' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Import the key
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          # Get fingerprint
          GPG_FINGERPRINT=$(gpg --list-secret-keys --keyid-format=long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_FINGERPRINT=${GPG_FINGERPRINT}" >> $GITHUB_ENV
          echo "Imported GPG key with fingerprint: ${GPG_FINGERPRINT}"

          # Configure GPG for non-interactive signing
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

      - name: Copy manifest for release
        run: |
          cp terraform-registry-manifest.json terraform-provider-verda_${RELEASE_VERSION}_manifest.json

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: ${{ env.GORELEASER_ARGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload dry-run artifacts
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-verda-${{ env.RELEASE_TAG }}-snapshot
          path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_manifest.json
